# Copy this file to config.yaml and fill in the environment variables that
# hold your API keys. config.yaml is gitignored — never commit real keys.
#
# Every profile's `api_key_env` names an environment variable that the client
# reads at startup. Keys live in your shell/secret-manager, not in this file.

default_profile: local

profiles:
  # Local vLLM / Ollama — no real key needed.
  local:
    base_url: "http://localhost:8000/v1"
    api_key_env: "VLLM_API_KEY"   # unset -> empty key (fine for local vLLM)
    model: "qwen3-14b"
    temperature: 0.2
    max_tokens: 4096
    context_length: 8192
    timeout: 120

  # Example cloud endpoint. Put the key in the named env var.
  # deepseek-v4-flash is the recommended model (see README: it beats -pro on
  # strict-JSON compliance and cost); deepseek-chat is the public API alias.
  cloud:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    model: "deepseek-v4-flash"
    temperature: 0.2
    max_tokens: 4096
    timeout: 60
    rpm: 60            # requests/minute cap; the client throttles to avoid 429
    # DeepSeek 思考模式默认开启且忽略 `temperature`：能显著提升 bug 检出率
    # （quixbugs 行级召回 57.5%→92.5%）。但 reasoning 与正文共享 max_tokens
    # 预算，必须同步把 lra/agents/reviewer.py 的 MAX_OUTPUT_TOKENS 调到
    # 16384，否则 reasoning 会吃满 2048 把正文 JSON 截断（no JSON object found）。
    extra_body: {"thinking": {"type": "enabled"}}

  # Qwen text flagship (Aliyun DashScope). Requires a STANDARD pay-as-you-go
  # `sk-` key (NOT a Token Plan `sk-sp-` key) in DASHSCOPE_API_KEY.
  qwen38max:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "qwen3.8-max-preview"
    temperature: 0.2
    max_tokens: 4096
    context_length: 128000
    timeout: 90
    rpm: 60

  # Multimodal model (Aliyun Bailian / DashScope) — for visual understanding.
  # qwen-vl-max is the stable flagship VL model; alternatives: qwen3-vl-plus,
  # qwen-vl-plus. Set DASHSCOPE_API_KEY in your environment.
  vision:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "qwen-vl-max"
    temperature: 0.4
    max_tokens: 2048
    timeout: 90

review:
  # Second-review (arbitration) profile name, or null to run single-pass.
  second_profile: null
  # Max parallel review chunks (LangGraph max_concurrency).
  concurrency: 16

# Optional deterministic LSP diagnostics (zero LLM). A language server runs
# type checks / undefined-name checks and emits high-precision candidate bugs
# that the LLM only needs to verify. Each `servers` value must be installed on
# PATH — e.g. `pip install pyright` provides `pyright-langserver`. Missing or
# broken servers are skipped silently, so leave `enabled: false` unless you
# have the servers installed.
lsp:
  enabled: false
  timeout: 30
  servers:
    python: "pyright-langserver --stdio"
    # typescript: "typescript-language-server --stdio"
    # rust: "rust-analyzer"

# Optional deterministic build check run inside the optimizer workspace.
build_check:
  enabled: true
  timeout: 30
  commands:
    py: "ruff check"
