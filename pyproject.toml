[project]
name = "lra"
version = "2.0.0"
description = "Code review agent built on LangGraph — self-contained single package"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lra = "lra.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lra*"]

[tool.setuptools.package-data]
lra = ["prompts/*.md", "prompts/supplements/*.md"]
