[project]
name = "lra-code-review"
version = "2.1.0"
description = "Code review agent built on LangGraph — self-contained single package"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["code-review", "langgraph", "llm", "static-analysis", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/030603-ccf/code-review-agent"
Repository = "https://github.com/030603-ccf/code-review-agent"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lra = "lra.__main__:main"
lra-code-review = "lra.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lra*"]

[tool.setuptools.package-data]
lra = ["prompts/*.md", "prompts/supplements/*.md"]
