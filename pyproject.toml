[project]
name = "lra"
version = "0.1.0"
description = "Langgraph Review Agent — LangGraph 编排版代码审查工具（自包含项目）"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lra*", "cra*"]
